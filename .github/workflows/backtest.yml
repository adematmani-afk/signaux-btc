name: Backtest

on:
  workflow_dispatch:
    inputs:
      watchlist:
        default: ""
  push:
    paths: ["signals.py", "config.json"]

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python signals.py backtest
      - run: python signals.py sweep
      - run: python signals.py alternatives
      - if: ${{ inputs.watchlist != '' }}
        run: python signals.py watchlist ${{ inputs.watchlist }}
