name: Suivi ANT premier jour

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  suivi:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python ant_watch.py loop
      - if: always()
        run: |
          git config user.name "signaux-bot"
          git config user.email "signaux-bot@users.noreply.github.com"
          git add state/ant_day.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Suivi ANT : résumé du jour" && git pull --rebase -q && git push)
