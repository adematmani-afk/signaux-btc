name: Signaux en direct

on:
  schedule:
    # Toutes les 5 min, lun-ven, de 13h à 21h59 UTC (couvre 9h30-16h à Toronto, heure d'été ou d'hiver).
    - cron: "*/5 13-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signaux
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python signals.py live
      - name: Sauvegarder l'état
        run: |
          git config user.name "signaux-bot"
          git config user.email "signaux-bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || (git commit -m "Mise à jour de l'état" && git push)
