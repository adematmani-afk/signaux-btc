name: Données du point du matin

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: Symboles Yahoo séparés par des espaces
        default: "BTC-CAD BTC-USD BTCC-B.TO FBTC.TO CAD=X INTC INTC.NE QBTS FGI CCXI NOK"

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python brief.py ${{ inputs.symbols }}
